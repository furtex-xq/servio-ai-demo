<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servio AI — live demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="mark.png">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0A0806;color:#F4EADB;font:17px/1.6 "Karla","Segoe UI",system-ui,sans-serif}
.lock{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;
  background:radial-gradient(60% 50% at 50% 0%,rgba(242,182,48,.16),transparent 70%),#0A0806}
.card{max-width:460px;text-align:center}
.card img{width:76px;height:76px}
.wm{font:600 30px Georgia,"Playfair Display",serif;margin-top:6px;letter-spacing:.01em}.wm i{font-style:italic;font-weight:600;background:linear-gradient(95deg,#F5C04A,#F59E2E 55%,#FF7A4D);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em;margin-left:.02em}
h1{font:600 34px/1.15 Georgia,serif;margin:16px 0 10px}
p{color:#C4B49C;margin:0 0 24px}
a.b{display:inline-flex;padding:14px 24px;border-radius:999px;font-weight:800;text-decoration:none;margin:4px}
a.g{background:linear-gradient(95deg,#F5C04A,#F59E2E 60%,#FF7A4D);color:#2A1503}
a.o{border:1.5px solid rgba(255,227,161,.3);color:#F4EADB}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,227,161,.2);border-top-color:#F2B630;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.embed .lock{background:#000}
</style>
</head>
<body>
<div class="lock" id="lock"><div class="spin"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="../auth.js?v=1"></script>
<script>
// The demo is private. This page only loads it for accounts an administrator has approved:
// the code itself comes from site_get_demo() on the server, never from a public file.
// It also runs only if it is exactly the build pinned here (SHA-256), so even someone able to change
// the stored copy cannot get their own script onto this site. Update the hash with each new build.
const DEMO_SHA256 = "cdb5d63b2c179fc6d83a31ba403ae820550bfbae22c6da602aac7fe30b860805";
(async function () {
  const embed = new URLSearchParams(location.search).has("embed");
  const ru = /^(ru|uk)/.test((() => { try { return localStorage.getItem("servio_lang") } catch (e) { return "" } })() || navigator.language || "");
  const L = (r, e) => ru ? r : e;
  if (embed) document.body.classList.add("embed");
  let state = "out";
  try {
    const { sb, gunzipB64 } = window.servio;
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      state = "wait";
      const { data, error } = await sb.rpc("site_get_demo");
      if (!error && data) {
        const html = await gunzipB64(data);
        const digest = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(html))))
          .map(b => b.toString(16).padStart(2, "0")).join("");
        if (digest === DEMO_SHA256) {
          document.open(); document.write(html); document.close();
          return;
        }
        console.warn("demo build does not match the pinned hash");
        state = "update";
      }
    }
  } catch (e) { console.warn(e); }
  if (embed) { document.getElementById("lock").innerHTML = ""; return; }
  document.getElementById("lock").innerHTML = `<div class="card"><img src="mark.png" alt=""><div class="wm">Servio <i>AI</i></div>
    <h1>${state === "update" ? L("Демо обновляется", "The demo is being updated") : state === "wait" ? L("Доступ скоро откроем", "Access is on its way") : L("Живое демо — по доступу", "The live demo is private")}</h1>
    <p>${state === "wait" ? L("Ваш аккаунт ещё не одобрен для демо. Запросите доступ в кабинете — мы ответим в течение дня.", "Your account isn't approved for the demo yet. Request access in your account — we reply within a day.")
      : L("Войдите или создайте аккаунт и запросите доступ. Весь остальной сайт открыт без регистрации.", "Sign in or create an account and request access. The rest of the site is open without an account.")}</p>
    <a class="b g" href="../account.html?next=demo">${state === "wait" ? L("В кабинет", "Your account") : L("Войти или зарегистрироваться", "Sign in or sign up")}</a>
    <a class="b o" href="../">${L("На сайт", "Back to the site")}</a></div>`;
})();
</script>
</body>
</html>
