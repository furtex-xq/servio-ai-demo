<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аккаунт · Account — Servio AI</title>
<meta name="description" content="Вход и регистрация на сайте Servio AI. Sign in to Servio AI.">
<meta name="robots" content="noindex">
<link rel="icon" href="mark.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("servio_theme")||"dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Karla:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="legal.css?v=4">
<link rel="stylesheet" href="site-ui.css?v=2">
</head>
<body>
<div class="bar"></div>
<nav class="nav"><div class="in">
  <a class="home" href="./"><img src="mark.png" alt="">Servio <i>AI</i></a>
  <div class="links"><a href="./" data-ru="Главная" data-en="Home">Главная</a><a href="download.html" data-ru="Скачать" data-en="Download">Скачать</a><a class="cur" href="account.html" data-ru="Аккаунт" data-en="Account">Аккаунт</a></div>
  <button class="theme" id="themeBtn" type="button" aria-label="Light or dark theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></button>
  <div class="tabs"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</div></nav>

<main class="acc" id="app"><div class="box"><div class="spin"></div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="auth.js?v=1"></script>
<script src="legal.js?v=3"></script>
<script>
(function () {
  const { sb, access, SITE } = window.servio;
  const app = document.getElementById("app");
  const qs = new URLSearchParams(location.search);
  const next = qs.get("next") === "demo" ? "demo" : "";
  const L = (ru, en) => document.documentElement.lang === "ru" ? ru : en;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const APPLE = false;   // switch on once Sign in with Apple is configured in Supabase
  let how = "link", mode = qs.get("signup") ? "up" : "in", view = "loading", info = null, me = null, msg = "", err = "";

  function msgs() { return (err ? `<div class="msg bad">${esc(err)}</div>` : "") + (msg ? `<div class="msg ok">${esc(msg)}</div>` : ""); }
  function translateError(e) {
    const m = (e && (e.message || e.error_description)) || String(e);
    if (/invalid login/i.test(m)) return L("Неверная почта или пароль.", "Wrong email or password.");
    if (/not confirmed/i.test(m)) return L("Почта ещё не подтверждена — откройте письмо со ссылкой.", "Your email isn't confirmed yet — open the link we sent you.");
    if (/already registered|already exists/i.test(m)) return L("Такой аккаунт уже есть — войдите.", "This account already exists — sign in.");
    if (/password.*(6|characters|weak)/i.test(m)) return L("Пароль слишком короткий: минимум 8 символов.", "The password is too short: at least 8 characters.");
    if (/rate limit|too many/i.test(m)) return L("Слишком много попыток. Попробуйте через минуту.", "Too many attempts. Try again in a minute.");
    return m;
  }

  function render() {
    if (view === "loading") { app.innerHTML = `<div class="box"><div class="spin"></div></div>`; return; }
    if (view === "auth") {
      app.innerHTML = `<div class="box">
        <div class="eyebrow">${L("Аккаунт Servio AI", "Servio AI account")}</div>
        <h1>${how === "pass" && mode === "up" ? L("Регистрация", "Create an account") : L("Вход и регистрация", "Sign in or sign up")}</h1>
        <p class="sub">${next === "demo" ? L("Живое демо закрытое. Войдите или зарегистрируйтесь — и запросите доступ.", "The live demo is private. Sign in or create an account, then request access.")
          : L("Сайт можно читать без аккаунта. Аккаунт нужен, чтобы получить доступ к живому демо.", "You can read the whole site without an account. An account lets you request access to the live demo.")}</p>
        <div class="oauth">
          <button class="sso g" type="button" data-p="google"><svg viewBox="0 0 48 48" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>${L("Продолжить с Google", "Continue with Google")}</button>
          ${APPLE ? `<button class="sso a" type="button" data-p="apple"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>${L("Продолжить с Apple", "Continue with Apple")}</button>` : ""}
        </div>
        <div class="or"><span>${L("или по почте", "or with email")}</span></div>
        <div class="seg"><button data-h="link" aria-pressed="${how === "link"}">${L("Ссылка на почту", "Email link")}</button><button data-h="pass" aria-pressed="${how === "pass"}">${L("С паролем", "With password")}</button></div>
        ${how === "link" ? `<form id="lk" autocomplete="on">
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          ${msgs()}
          <button class="go" type="submit">${L("Получить ссылку для входа", "Email me a sign-in link")}</button>
          <p class="fine">${L("Нет аккаунта — создадим автоматически. Пароль не нужен. Продолжая, вы принимаете", "No account yet? We'll create one. No password needed. By continuing you accept the")} <a href="terms.html">${L("Условия", "Terms")}</a> ${L("и", "and")} <a href="privacy.html">${L("Политику конфиденциальности", "Privacy Policy")}</a>.</p>
        </form>` : `<div class="seg sm"><button data-m="in" aria-pressed="${mode === "in"}">${L("Вход", "Sign in")}</button><button data-m="up" aria-pressed="${mode === "up"}">${L("Регистрация", "Sign up")}</button></div>
        <form id="f" autocomplete="on">
          ${mode === "up" ? `<label>${L("Имя", "Name")}<input name="name" required maxlength="80" autocomplete="name"></label>
          <label>${L("Ресторан или компания", "Restaurant or company")} <small>${L("необязательно", "optional")}</small><input name="company" maxlength="120" autocomplete="organization"></label>` : ""}
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>${L("Пароль", "Password")}<input name="password" type="password" required minlength="${mode === "up" ? 8 : 6}" autocomplete="${mode === "up" ? "new-password" : "current-password"}"></label>
          ${msgs()}
          <button class="go" type="submit">${mode === "in" ? L("Войти", "Sign in") : L("Создать аккаунт", "Create account")}</button>
          ${mode === "in" ? `<button class="link" type="button" id="forgot">${L("Забыли пароль?", "Forgot your password?")}</button>` : `<p class="fine">${L("Регистрируясь, вы принимаете", "By signing up you accept the")} <a href="terms.html">${L("Условия", "Terms")}</a> ${L("и", "and")} <a href="privacy.html">${L("Политику конфиденциальности", "Privacy Policy")}</a>.</p>`}
        </form>`}</div>`;
      app.querySelectorAll(".seg button[data-h]").forEach(b => b.onclick = () => { how = b.dataset.h; err = msg = ""; render(); });
      app.querySelectorAll(".sso").forEach(b => b.onclick = () => oauth(b.dataset.p));
      const lk = document.getElementById("lk"); if (lk) lk.onsubmit = sendLink;
      app.querySelectorAll(".seg button[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; err = msg = ""; render(); });
      const fg = document.getElementById("forgot"); if (fg) fg.onclick = forgot;
      const f = document.getElementById("f"); if (f) f.onsubmit = submit;
      return;
    }
    if (view === "check") {
      app.innerHTML = `<div class="box center"><div class="big">✉️</div><h1>${L("Проверьте почту", "Check your email")}</h1>
        <p class="sub">${L("Мы отправили ссылку для входа на", "We sent a sign-in link to")} <b>${esc(info)}</b>. ${L("Откройте её — и вы окажетесь в аккаунте.", "Open it and you'll be signed in.")}</p>
        <p class="fine">${L("Письма нет? Проверьте «Спам» через пару минут.", "No email? Check your spam folder in a couple of minutes.")}</p>
        <button class="ghost" id="back">${L("Назад ко входу", "Back to sign in")}</button></div>`;
      document.getElementById("back").onclick = () => { view = "auth"; mode = "in"; render(); };
      return;
    }
    if (view === "reset") {
      app.innerHTML = `<div class="box"><div class="eyebrow">${L("Восстановление", "Recovery")}</div><h1>${L("Новый пароль", "New password")}</h1>
        <form id="r"><label>${L("Новый пароль", "New password")}<input name="p" type="password" minlength="8" required autocomplete="new-password"></label>${msgs()}
        <button class="go" type="submit">${L("Сохранить", "Save")}</button></form></div>`;
      document.getElementById("r").onsubmit = async e => { e.preventDefault(); err = msg = "";
        const { error } = await sb.auth.updateUser({ password: e.target.p.value });
        if (error) { err = translateError(error); render(); return; }
        msg = L("Пароль изменён.", "Password changed."); await load(); };
      return;
    }
    // signed in
    const a = info || {};
    const demoCard = a.demo
      ? `<div class="card ok"><div class="row"><span class="pill ok">● ${L("Доступ открыт", "Access granted")}</span></div><h2>${L("Живое демо", "Live demo")}</h2>
         <p>${L("Целый ресторан в браузере: гость, кухня, официант и владелец на одних данных.", "A whole restaurant in your browser: guest, kitchen, waiter and owner on the same data.")}</p>
         <a class="go" href="demo/?present">${L("Открыть живое демо →", "Open the live demo →")}</a></div>`
      : a.requested
        ? `<div class="card"><div class="row"><span class="pill wait">● ${L("Заявка на рассмотрении", "Request pending")}</span></div><h2>${L("Живое демо", "Live demo")}</h2>
           <p>${L("Мы получили заявку и откроем доступ после проверки. Обычно — в течение дня.", "We have your request and will open access after a quick check — usually within a day.")}</p></div>`
        : `<div class="card"><div class="row"><span class="pill">🔒 ${L("Демо закрытое", "Private demo")}</span></div><h2>${L("Запросить доступ к демо", "Request demo access")}</h2>
           <p>${L("Демо открываем ресторанам, партнёрам и инвесторам. Пара слов о вас поможет одобрить быстрее.", "We open the demo to restaurants, partners and investors. A few words about you help us approve faster.")}</p>
           <form id="rq"><label>${L("Ресторан или компания", "Restaurant or company")}<input name="rest" maxlength="120" value="${esc(a.company)}"></label>
           <label>${L("Телефон, Telegram или WhatsApp", "Phone, Telegram or WhatsApp")} <small>${L("необязательно", "optional")}</small><input name="contact" maxlength="120"></label>
           <label>${L("Зачем вам демо?", "What do you want to see?")} <small>${L("необязательно", "optional")}</small><textarea name="msg" maxlength="1000" rows="3"></textarea></label>
           ${msgs()}<button class="go" type="submit">${L("Запросить доступ", "Request access")}</button></form></div>`;
    app.innerHTML = `<div class="box wide">
      <div class="eyebrow">${L("Личный кабинет", "Your account")}</div>
      <h1>${L("Здравствуйте", "Hello")}${a.full_name ? ", " + esc(a.full_name.split(" ")[0]) : ""}!</h1>
      <p class="sub">${esc(me?.email || "")}</p>
      ${demoCard}
      <div class="grid">
        <a class="card tile" href="download.html"><b>⬇ ${L("Скачать для Android", "Download for Android")}</b><span>${L("14 дней бесплатно", "14 days free")}</span></a>
        <a class="card tile" href="./#film"><b>▶ ${L("Видео", "Films")}</b><span>${L("1 минута и 5 минут", "1 minute and 5 minutes")}</span></a>
        <a class="card tile" href="./#contact"><b>✉ ${L("Связаться", "Contact us")}</b><span>supportservioai@gmail.com</span></a>
        ${a.admin ? `<a class="card tile admin" href="admin.html"><b>⚙ ${L("Админка сайта", "Site admin")}</b><span>${L("Пользователи, заявки, демо", "Members, requests, demo")}</span></a>` : ""}
      </div>
      <details class="card"><summary>${L("Профиль", "Profile")}</summary>
        <form id="pf"><label>${L("Имя", "Name")}<input name="name" maxlength="80" value="${esc(a.full_name)}"></label>
        <label>${L("Ресторан или компания", "Restaurant or company")}<input name="company" maxlength="120" value="${esc(a.company)}"></label>
        <button class="ghost" type="submit">${L("Сохранить", "Save")}</button></form></details>
      <button class="link" id="out">${L("Выйти", "Sign out")}</button>
    </div>`;
    document.getElementById("out").onclick = async () => { await sb.auth.signOut(); info = null; view = "auth"; mode = "in"; render(); };
    const rq = document.getElementById("rq");
    if (rq) rq.onsubmit = async e => { e.preventDefault(); err = msg = "";
      const f = e.target, b = f.querySelector("button"); b.disabled = true;
      const { error } = await sb.rpc("site_request_demo", { p_name: a.full_name || me.email, p_contact: f.contact.value.trim() || me.email,
        p_restaurant: f.rest.value, p_city: "", p_when: "", p_message: f.msg.value });
      if (error) { err = translateError(error); b.disabled = false; render(); return; }
      if (f.rest.value && !a.company) await sb.rpc("site_join", { p_full_name: null, p_company: f.rest.value });
      await load(); };
    document.getElementById("pf").onsubmit = async e => { e.preventDefault();
      await sb.rpc("site_join", { p_full_name: e.target.name.value, p_company: e.target.company.value }); await load(); };
  }

  async function submit(e) {
    e.preventDefault(); err = msg = ""; const f = e.target, b = f.querySelector(".go"); b.disabled = true;
    const email = f.email.value.trim(), password = f.password.value;
    if (mode === "in") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { err = translateError(error); render(); return; }
      await load(true);
    } else {
      const name = f.name.value.trim(), company = f.company.value.trim();
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE + "account.html" + (next ? "?next=" + next : ""), data: { full_name: name, company, source: "site" } } });
      if (error) { err = translateError(error); render(); return; }
      if (data.session) { await sb.rpc("site_join", { p_full_name: name, p_company: company }); await load(true); }
      else { info = email; view = "check"; render(); }
    }
  }
  const back = () => SITE + "account.html" + (next ? "?next=" + next : "");
  async function oauth(provider) {
    err = msg = "";
    const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: back() } });
    if (error) { err = translateError(error); render(); }
  }
  async function sendLink(e) {
    e.preventDefault(); err = msg = ""; const f = e.target, b = f.querySelector(".go"); b.disabled = true;
    const email = f.email.value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: back(), shouldCreateUser: true, data: { source: "site" } } });
    if (error) { err = translateError(error); render(); app.querySelector("input[name=email]").value = email; return; }
    info = email; view = "check"; render();
  }
  async function forgot() {
    const email = app.querySelector("input[name=email]").value.trim();
    err = msg = "";
    if (!email) { err = L("Введите почту, и мы пришлём ссылку.", "Type your email and we'll send a link."); render(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE + "account.html" });
    if (error) err = translateError(error); else msg = L("Ссылка для смены пароля отправлена на почту.", "We emailed you a link to set a new password.");
    render(); app.querySelector("input[name=email]").value = email;
  }
  async function load(fromLogin) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { view = "auth"; render(); return; }
    me = session.user;
    const meta = me.user_metadata || {};
    const { data } = await sb.rpc("site_join", { p_full_name: meta.full_name || null, p_company: meta.company || null });
    info = data || await access();
    if (next === "demo" && info.demo && fromLogin !== false) { location.replace("demo/?present"); return; }
    view = "in"; render();
  }
  sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") { view = "reset"; render(); } });
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTimeout(render, 0)));
  setTimeout(() => { if (view !== "reset") load(); }, 50);
})();
</script>
</body>
</html>
